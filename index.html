<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0F1117; --surface: #1A1D27; --surface-hover: #222536;
            --border: #2A2E40; --accent: #4F7CFF; --accent-dim: #1E2D5A;
            --dispute: #FF6B6B; --dispute-dim: #3D1E1E;
            --green: #4CAF7D; --text: #E8EAF0;
            --text-muted: #7B8099; --text-dim: #4A4F66;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
        
        /* Nav */
        .nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; }
        .nav-brand { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 4px; margin-left: 20px; }
        .nav-link { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; padding: 6px 12px; border-radius: 6px; font-family: inherit; }
        .nav-link:hover { background: var(--surface-hover); color: var(--text); }
        .nav-link.active { color: var(--accent); }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .nav-user { font-size: 12px; color: var(--text-muted); }
        .btn-logout { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 4px 8px; border-radius: 4px; font-family: inherit; }
        .btn-logout:hover { color: var(--text); }
        
        /* Login */
        .login-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
        .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 380px; }
        .login-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 32px; }
        .login-title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; }
        
        /* Forms */
        label.lbl { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 6px; }
        input[type="text"], input[type="date"], select, textarea {
            width: 100%; background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 14px; color: var(--text);
            font-size: 14px; font-family: inherit; outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        select option { background: var(--surface); }
        textarea { resize: vertical; min-height: 100px; }
        .fg { margin-bottom: 16px; }
        
        /* Buttons */
        .btn { border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; width: 100%; margin-top: 16px; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .bs { border: none; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .bs-primary { background: var(--accent); color: #fff; }
        .bs-primary:hover { opacity: 0.9; }
        .bs-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .bs-dispute { background: var(--dispute-dim); color: var(--dispute); border: 1px solid rgba(255,107,107,0.2); }
        .bs-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .bs-outline:hover { color: var(--text); }
        .bs-outline.active { color: var(--accent); border-color: var(--accent); }
        .bs-full { width: 100%; padding: 10px; }
        
        .err { color: #FF6B6B; font-size: 12px; margin-top: 8px; }
        .suc { color: var(--green); font-size: 12px; margin-top: 8px; }
        
        /* Pages */
        .page { padding: 28px 24px; max-width: 720px; margin: 0 auto; }
        .page-wide { padding: 28px 24px; max-width: 960px; margin: 0 auto; }
        .ph { margin-bottom: 28px; }
        .pt { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .ps { font-size: 13px; color: var(--text-muted); }
        .st { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        
        /* Cards */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .card-d { background: var(--dispute-dim); border: 1px solid rgba(255,107,107,0.27); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .card-s { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; opacity: 0.7; }
        .card-max { max-width: 520px; }
        
        /* Tags */
        .tag { display: inline-block; border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 600; }
        .tag-n { background: var(--accent-dim); color: var(--accent); }
        .tag-s { background: var(--border); color: var(--text-muted); }
        .tag-d { background: var(--dispute-dim); color: var(--dispute); border: 1px solid rgba(255,107,107,0.3); }
        
        .ch { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
        .ct { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .cd { font-size: 12px; color: var(--text-muted); }
        
        .vframe { width: 100%; height: 200px; border: none; border-radius: 8px; background: #000; margin-bottom: 12px; display: block; }
        .dr { background: rgba(255,107,107,0.07); border: 1px solid rgba(255,107,107,0.2); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--dispute); margin-bottom: 10px; }
        
        .row { display: flex; align-items: center; gap: 8px; }
        .btwn { display: flex; align-items: center; justify-content: space-between; }
        .fe { display: flex; justify-content: flex-end; }
        
        /* Table */
        .tw { border-radius: 12px; overflow: auto; border: 1px solid var(--border); max-height: 70vh; }
        table { width: 100%; border-collapse: collapse; background: var(--surface); }
        th { text-align: left; padding: 10px 14px; font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 1px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 10; }
        td { padding: 11px 14px; font-size: 13px; border-bottom: 1px solid rgba(42,46,64,0.5); }
        tr:last-child td { border-bottom: none; }
        
        /* Modal */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 420px; margin: 16px; }
        .mt { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .ms { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .ma { display: flex; gap: 8px; margin-top: 16px; }
        .ma .bs { flex: 1; padding: 10px; }
        
        .empty { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 13px; }
        .empty-icon { font-size: 36px; margin-bottom: 12px; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }
        .sep { color: var(--text-dim); font-size: 13px; margin: 4px 0 12px; }
        .fr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .fb-btns { display: flex; gap: 6px; }
        
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px; }
            .page, .page-wide { padding: 20px 16px; }
            .nav { padding: 0 16px; }
        }
    </style>
</head>
<body>
<div id="app"><div class="loading" style="margin-top:40vh">Loading...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const sb = createClient(
    'https://escuywjpykvzzvfqhmmr.supabase.co',
    'sb_publishable_s5uso5Ry4A8DO27yFFChRw_XQcSeQes'
);

// ── State ────────────────────────────────────────────────────────────────────
let S = {
    user: JSON.parse(localStorage.getItem('fb_user') || 'null'),
    view: null,
    feedbacks: [],
    collectors: [],
    disputeTarget: null,
    filter: 'all',
};

// ── DB helpers ───────────────────────────────────────────────────────────────
async function ensureTrainer() {
    try {
        const { data, error } = await sb.from('profiles').select('id').eq('hr_code','TRAINER').maybeSingle();
        if (!data) {
            await sb.from('profiles').insert([{ hr_code:'TRAINER', full_name:'Trainer', role:'trainer' }]);
        }
    } catch(e) {
        console.log('ensureTrainer error:', e);
    }
}

async function loginUser(hrCode) {
    const { data } = await sb.from('profiles').select('*').eq('hr_code', hrCode.trim().toUpperCase()).maybeSingle();
    return data;
}

async function fetchCollectorFeedbacks(collectorId) {
    const { data, error } = await sb.from('feedbacks').select('*').eq('collector_id', collectorId);
    if (error) console.error('fetch error:', error);
    return data || [];
}

async function fetchAllFeedbacks() {
    const { data: fbs } = await sb.from('feedbacks').select('*');
    if (!fbs || fbs.length === 0) return [];
    const hrCodes = [...new Set(fbs.map(f => f.collector_id).filter(Boolean))];
    let profileMap = {};
    if (hrCodes.length > 0) {
        const { data: profiles } = await sb.from('profiles').select('full_name,hr_code').in('hr_code', hrCodes);
        (profiles || []).forEach(p => { profileMap[p.hr_code] = p; });
    }
    return fbs.map(f => ({ ...f, _profile: profileMap[f.collector_id] || null }));
}

async function fetchCollectors() {
    const { data } = await sb.from('profiles').select('*').eq('role','collector').order('full_name');
    return data || [];
}

async function doSendFeedback(collectorId, trainerName, date, videoUrl, title) {
    // Auto-convert Google Drive view link to preview link
    if (videoUrl.includes('drive.google.com') && videoUrl.includes('/view')) {
        videoUrl = videoUrl.split('/view')[0] + '/preview';
    }
    const { error } = await sb.from('feedbacks').insert({
        collector_id: collectorId, trainer_name: trainerName,
        feedback_date: date, video_url: videoUrl,
        feedback_title: title,
        is_seen: false, is_disputed: false, dispute_reason: ''
    });
    return !error;
}

async function doAddCollector(hrCode, fullName) {
    const { error } = await sb.from('profiles').insert({ hr_code: hrCode.trim().toUpperCase(), full_name: fullName.trim(), role: 'collector' });
    return !error;
}

async function doMarkSeen(id) { await sb.from('feedbacks').update({ is_seen: true }).eq('id', id); }
async function doDispute(id, reason) { await sb.from('feedbacks').update({ is_disputed: true, dispute_reason: reason }).eq('id', id); }

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmtDate(d) {
    if (!d) return '—';
    const [y,m,day] = d.split('-');
    return new Date(y, m-1, day).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
}
function today() { return new Date().toISOString().split('T')[0]; }
function el(id) { return document.getElementById(id); }
function show(id) { const e = el(id); if(e) e.style.display='block'; }
function hide(id) { const e = el(id); if(e) e.style.display='none'; }
function setTxt(id, t) { const e = el(id); if(e) e.textContent = t; }

// ── Nav ──────────────────────────────────────────────────────────────────────
function navHtml() {
    const isT = S.user && S.user.role === 'trainer';
    const links = isT ? `
        <button class="nav-link ${S.view==='trainer_feedback'?'active':''}" onclick="nav('trainer_feedback')">Feedback</button>
        <button class="nav-link ${S.view==='trainer_collectors'?'active':''}" onclick="nav('trainer_collectors')">Collectors</button>
        <button class="nav-link ${S.view==='trainer_profiles'?'active':''}" onclick="nav('trainer_profiles')">Profiles</button>
        <button class="nav-link ${S.view==='trainer_analytics'?'active':''}" onclick="nav('trainer_analytics')">Analytics</button>
    ` : '';
    return `<nav class="nav">
        <div class="row"><span class="nav-brand">FEEDBACK</span><div class="nav-links">${links}</div></div>
        <div class="nav-right">
            <span class="nav-user">${S.user ? S.user.full_name+' · '+S.user.hr_code : ''}</span>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>`;
}

function nav(view) {
    S.view = view;
    if (view === 'trainer_feedback') loadTrainerFeedback();
    else if (view === 'trainer_collectors') loadTrainerCollectors();
    else if (view === 'trainer_profiles') loadTrainerProfiles();
    else if (view === 'trainer_analytics') loadTrainerAnalytics();
}

function logout() {
    S.user = null; S.feedbacks = []; S.collectors = [];
    localStorage.removeItem('fb_user');
    renderLogin();
}

const TRAINER_PASSWORD = 'Trainer@hudl';

// ── Login ────────────────────────────────────────────────────────────────────
function renderLogin(step, pendingUser) {
    step = step || 1;
    const isStep2 = step === 2;
    el('app').innerHTML = `
        <div class="login-wrap">
            <div class="login-card">
                <div class="login-eyebrow">Collection · Feedback</div>
                <div class="login-title">Welcome</div>
                <div class="login-sub">${isStep2 ? 'Enter your password' : 'Sign in with your HR Code'}</div>
                ${!isStep2 ? `
                <div class="fg">
                    <label class="lbl">HR CODE</label>
                    <input type="text" id="hrc" placeholder="e.g. A-275" onkeydown="if(event.key===\'Enter\')doLogin()" />
                </div>
                <div id="lerr" class="err" style="display:none"></div>
                <button class="btn btn-primary" onclick="doLogin()">Next</button>
                ` : `
                <div class="fg">
                    <label class="lbl">PASSWORD</label>
                    <input type="password" id="hpw" placeholder="Enter password" onkeydown="if(event.key===\'Enter\')doLoginStep2()" />
                </div>
                <div id="lerr" class="err" style="display:none"></div>
                <div style="display:flex;gap:8px;margin-top:16px">
                    <button class="btn btn-primary" style="margin:0" onclick="doLoginStep2()">Sign In</button>
                    <button class="btn" style="margin:0;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);width:auto;padding:12px 20px" onclick="renderLogin()">Back</button>
                </div>`}
            </div>
        </div>`;
    if (isStep2) {
        window._pendingUser = pendingUser;
        setTimeout(() => { const p = el('hpw'); if(p) p.focus(); }, 50);
    }
}

async function doLogin() {
    const code = el('hrc').value.trim();
    if (!code) { el('lerr').textContent='Please enter your HR Code'; show('lerr'); return; }
    hide('lerr');
    const btn = el('app').querySelector('button');
    btn.textContent = 'Checking...'; btn.disabled = true;
    const user = await loginUser(code);
    if (!user) {
        renderLogin();
        el('lerr').textContent = 'HR Code not found or not registered';
        show('lerr');
        return;
    }
    if (user.role === 'trainer') {
        renderLogin(2, user);
    } else {
        S.user = user;
        localStorage.setItem('fb_user', JSON.stringify(user));
        S.view = 'collector'; loadCollector();
    }
}

function doLoginStep2() {
    const pw = el('hpw').value;
    if (!pw) { el('lerr').textContent='Please enter your password'; show('lerr'); return; }
    if (pw !== TRAINER_PASSWORD) { el('lerr').textContent='Incorrect password'; show('lerr'); return; }
    const user = window._pendingUser;
    S.user = user;
    localStorage.setItem('fb_user', JSON.stringify(user));
    S.view = 'trainer_feedback'; loadTrainerFeedback();
}

// ── Collector ────────────────────────────────────────────────────────────────
async function loadCollector() {
    el('app').innerHTML = navHtml() + `<div class="page"><div class="loading">Loading...</div></div>`;
    S.feedbacks = await fetchCollectorFeedbacks(S.user.hr_code);
    renderCollector();
}

function renderCollector() {
    const unseen = S.feedbacks.filter(f => !f.is_seen);
    const seen = S.feedbacks.filter(f => f.is_seen);
    let html = '';

    if (S.feedbacks.length === 0) {
        html = `<div class="empty"><div class="empty-icon">📋</div>No feedback yet</div>`;
    } else {
        unseen.forEach(f => html += fbCard(f, true));
        if (seen.length > 0) {
            html += `<div class="sep">Previously viewed</div>`;
            seen.forEach(f => html += fbCard(f, false));
        }
    }

    const sub = unseen.length > 0 ? `You have ${unseen.length} new feedback${unseen.length>1?'s':''}` : 'No new feedback';

    el('app').innerHTML = navHtml() + `
        <div class="page">
            <div class="ph"><div class="pt">Welcome, ${S.user.full_name}</div><div class="ps">${sub}</div></div>
            ${html}
        </div>
        ${S.disputeTarget ? disputeModal() : ''}`;
    bindIframes();
}

function fbCard(f, isNew) {
    const cls = f.is_disputed ? 'card-d' : isNew ? 'card' : 'card-s';
    const tag = f.is_disputed ? `<span class="tag tag-d">Disputed</span>`
        : isNew ? `<span class="tag tag-n">New</span>` : `<span class="tag tag-s">Seen</span>`;
    const video = f.video_url ? `<iframe src="${f.video_url}" class="vframe" data-id="${f.id}" data-seen="${f.is_seen}" allowfullscreen></iframe>` : '';
    const reason = f.is_disputed && f.dispute_reason ? `<div class="dr"><strong>Dispute reason:</strong> ${f.dispute_reason}</div>` : '';
    const dBtn = !f.is_disputed ? `<div class="fe"><button class="bs bs-dispute" onclick="openDispute('${f.id}')">Dispute</button></div>` : '';
    const titleHtml = f.feedback_title ? `<div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">${f.feedback_title}</div>` : '';
    return `<div class="${cls}">
        <div class="ch"><div><div class="ct">${fmtDate(f.feedback_date)}</div><div class="cd">From: ${f.trainer_name||'Trainer'}</div></div><div>${tag}</div></div>
        ${titleHtml}${video}${reason}${dBtn}
    </div>`;
}

function bindIframes() {
    document.querySelectorAll('iframe.vframe[data-seen="false"]').forEach(fr => {
        fr.addEventListener('load', async () => {
            const fid = fr.dataset.id;
            await doMarkSeen(fid);
            const fb = S.feedbacks.find(f => f.id === fid);
            if (fb) fb.is_seen = true;
        });
    });
}

function openDispute(id) {
    S.disputeTarget = S.feedbacks.find(f => f.id === id);
    renderCollector();
}

function closeDispute() { S.disputeTarget = null; renderCollector(); }

async function confirmDispute() {
    const reason = el('dreason').value.trim();
    if (!reason) { show('derr'); return; }
    hide('derr');
    await doDispute(S.disputeTarget.id, reason);
    const fb = S.feedbacks.find(f => f.id === S.disputeTarget.id);
    if (fb) { fb.is_disputed = true; fb.dispute_reason = reason; }
    S.disputeTarget = null;
    renderCollector();
}

function disputeModal() {
    return `<div class="overlay">
        <div class="modal">
            <div class="mt">Submit Dispute</div>
            <div class="ms">Feedback: <strong>${fmtDate(S.disputeTarget.feedback_date)}</strong></div>
            <div class="fg"><label class="lbl">REASON FOR DISPUTE</label>
            <textarea id="dreason" placeholder="Explain why you disagree with this feedback..."></textarea></div>
            <div id="derr" class="err" style="display:none">Please enter a reason</div>
            <div class="ma">
                <button class="bs bs-dispute" onclick="confirmDispute()">Confirm Dispute</button>
                <button class="bs bs-outline" onclick="closeDispute()">Cancel</button>
            </div>
        </div>
    </div>`;
}

// ── Trainer Feedback ─────────────────────────────────────────────────────────
async function loadTrainerFeedback() {
    S.view = 'trainer_feedback';
    el('app').innerHTML = navHtml() + `<div class="page-wide"><div class="loading">Loading...</div></div>`;
    [S.collectors, S.feedbacks] = await Promise.all([fetchCollectors(), fetchAllFeedbacks()]);
    renderTrainerFeedback();
}

function renderTrainerFeedback() {
    const filtered = S.filter === 'all' ? S.feedbacks
        : S.filter === 'unseen' ? S.feedbacks.filter(f => !f.is_seen)
        : S.feedbacks.filter(f => f.is_disputed);

    const rows = filtered.map(f => {
        const p = f._profile;
        const st = f.is_seen ? `<span class="tag tag-s">Seen</span>` : `<span class="tag tag-n">Not Seen</span>`;
        const dt = f.is_disputed ? `<span class="tag tag-d" title="${f.dispute_reason||''}">Disputed ⚠️</span>` : `<span style="color:var(--text-dim)">—</span>`;
        return `<tr>
            <td>${p ? p.full_name : '—'} <span style="color:var(--text-muted);font-size:11px">${p ? p.hr_code : ''}</span></td>
            <td>${fmtDate(f.feedback_date)}</td>
            <td>${st}</td><td>${dt}</td>
        </tr>`;
    }).join('');

    const opts = S.collectors.map(c => `<option value="${c.id}">${c.full_name} (${c.hr_code})</option>`).join('');
    const filterBtns = ['all','unseen','disputed'].map(f =>
        `<button class="bs bs-outline ${S.filter===f?'active':''}" onclick="setFilter('${f}')">${f==='all'?'All':f==='unseen'?'Not Seen':'Disputed'}</button>`
    ).join('');

    el('app').innerHTML = navHtml() + `
        <div class="page-wide">
            <div class="ph"><div class="pt">Send Feedback</div><div class="ps">Upload a feedback video for a collector</div></div>
            <div class="card card-max">
                <div class="fg"><label class="lbl">COLLECTOR</label>
                    <input type="text" id="fbColSearch" placeholder="Search by name or HR code..." oninput="filterCollectors(this.value)" autocomplete="off" />
                    <div id="fbColDropdown" style="display:none;position:relative;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;max-height:200px;overflow-y:auto;margin-top:4px"></div>
                    <input type="hidden" id="fbCol" />
                    <div id="fbColSelected" style="display:none;margin-top:6px;font-size:12px;color:var(--accent)"></div>
                </div>
                <div class="fg"><label class="lbl">FEEDBACK DATE</label><input type="date" id="fbDate" value="${today()}" /></div>
                <div class="fg"><label class="lbl">FEEDBACK TITLE</label><input type="text" id="fbTitle" placeholder="e.g. Call Review - Customer Objection" /></div>
                <div class="fg"><label class="lbl">VIDEO URL (Google Drive Preview)</label>

function setFilter(f) { S.filter = f; renderTrainerFeedback(); }

let _selectedCollectorHR = '';

function filterCollectors(query) {
    const dropdown = el('fbColDropdown');
    
    if (!query.trim()) { dropdown.style.display = 'none'; _selectedCollectorHR = ''; return; }
    
    const q = query.toLowerCase();
    const matches = S.collectors.filter(c => 
        c.full_name.toLowerCase().includes(q) || c.hr_code.toLowerCase().includes(q)
    ).slice(0, 10);
    
    if (matches.length === 0) {
        dropdown.innerHTML = '<div style="padding:10px 14px;color:var(--text-muted);font-size:13px">No results found</div>';
    } else {
        dropdown.innerHTML = matches.map(c => `
            <div class="col-opt"
                data-hr="${c.hr_code}"
                data-name="${c.full_name.replace(/"/g, '&quot;')}"
                style="padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)">
                <strong>${c.full_name}</strong> <span style="color:var(--text-muted)">${c.hr_code}</span>
            </div>
        `).join('');
        dropdown.querySelectorAll('.col-opt').forEach(div => {
            div.onmouseover = () => div.style.background = 'var(--surface-hover)';
            div.onmouseout = () => div.style.background = '';
            div.onclick = () => {
                _selectedCollectorHR = div.dataset.hr;
                el('fbColSearch').value = div.dataset.name + ' (' + div.dataset.hr + ')';
                el('fbColDropdown').style.display = 'none';
                el('fbColSelected').textContent = '✓ ' + div.dataset.name + ' selected';
                el('fbColSelected').style.display = 'block';
            };
        });
    }
    dropdown.style.display = 'block';
    _selectedCollectorHR = '';
    el('fbColSelected').style.display = 'none';
}

async function sendFb() {
    const col = _selectedCollectorHR, date = el('fbDate').value, url = el('fbUrl').value, title = el('fbTitle').value;
    if (!col || !date || !url || !title) { el('fberr').textContent='Please fill in all fields'; show('fberr'); return; }
    hide('fberr');
    const btn = document.querySelector('#app .bs-primary');
    btn.textContent = 'Sending...'; btn.disabled = true;
    const ok = await doSendFeedback(col, S.user.full_name, date, url, title);
    btn.textContent = 'Send Feedback'; btn.disabled = false;
    if (ok) {
        // Get collector email
        const collector = S.collectors.find(c => c.hr_code === col);
        const collectorEmail = collector ? collector.email || '' : '';
        const collectorName = collector ? collector.full_name : col;
        const fbTitle = el('fbTitle').value;
        
        _selectedCollectorHR = ''; el('fbColSearch').value = ''; el('fbColSelected').style.display='none'; el('fbUrl').value = ''; el('fbTitle').value = '';
        
        // Show success with email button
        const appUrl = 'https://ahmedfarghaly-hash.github.io/feedback-app/';
        const emailSubject = encodeURIComponent('New Feedback Available - ' + fbTitle);
        const emailBody = encodeURIComponent('Hi ' + collectorName + ',\n\nYou have a new feedback waiting for you.\n\nTitle: ' + fbTitle + '\n\nCheck your feedback here:\n' + appUrl + '\n\nBest regards,\n' + S.user.full_name);
        let mailtoLink;
        if (collectorEmail.includes('gmail.com')) {
            mailtoLink = 'https://mail.google.com/mail/?view=cm&to=' + encodeURIComponent(collectorEmail) + '&su=' + emailSubject + '&body=' + emailBody;
        } else {
            mailtoLink = 'mailto:' + collectorEmail + '?subject=' + emailSubject + '&body=' + emailBody;
        }
        
        S.feedbacks = await fetchAllFeedbacks();
        renderTrainerFeedback();
        showEmailBanner(mailtoLink, collectorName);
    } else { el('fberr').textContent='Error sending feedback'; show('fberr'); }
}

async function loadTrainerAnalytics() {
    S.view = 'trainer_analytics';
    el('app').innerHTML = navHtml() + '<div class="page-wide"><div class="loading">Loading...</div></div>';
    const [allFbs, allCollectors] = await Promise.all([fetchAllFeedbacks(), fetchCollectors()]);
    renderAnalytics(allFbs, allCollectors);
}

function renderAnalytics(allFbs, collectors) {
    // Build team map
    const teamMap = {};
    collectors.forEach(c => {
        if (!c.team) return;
        if (!teamMap[c.team]) teamMap[c.team] = { total: 0, seen: 0, disputed: 0, collectors: 0 };
        teamMap[c.team].collectors++;
    });

    allFbs.forEach(f => {
        const collector = collectors.find(c => c.hr_code === f.collector_id);
        if (!collector || !collector.team) return;
        const t = teamMap[collector.team];
        if (!t) return;
        t.total++;
        if (f.is_seen) t.seen++;
        if (f.is_disputed) t.disputed++;
    });

    // Sort teams by total feedback
    const teams = Object.entries(teamMap)
        .filter(([k, v]) => v.total > 0)
        .sort((a, b) => b[1].total - a[1].total);

    const allTeams = Object.entries(teamMap).sort((a, b) => a[0].localeCompare(b[0]));

    // Most common titles
    const titleCount = {};
    allFbs.forEach(f => {
        if (f.feedback_title) {
            titleCount[f.feedback_title] = (titleCount[f.feedback_title] || 0) + 1;
        }
    });
    const topTitles = Object.entries(titleCount).sort((a, b) => b[1] - a[1]).slice(0, 5);

    // Max for bar scaling
    const maxFb = Math.max(...allTeams.map(([k,v]) => v.total), 1);

    const teamRows = allTeams.map(([team, data]) => {
        const seenPct = data.total > 0 ? Math.round((data.seen / data.total) * 100) : 0;
        const dispPct = data.total > 0 ? Math.round((data.disputed / data.total) * 100) : 0;
        const barWidth = Math.round((data.total / maxFb) * 100);
        return '<tr>' +
            '<td style="font-weight:600;color:var(--accent)">' + team + '</td>' +
            '<td>' +
                '<div style="display:flex;align-items:center;gap:8px">' +
                '<div style="flex:1;background:var(--border);border-radius:4px;height:8px;min-width:80px">' +
                '<div style="width:' + barWidth + '%;background:var(--accent);height:8px;border-radius:4px"></div></div>' +
                '<span style="font-size:13px;min-width:20px">' + data.total + '</span>' +
                '</div>' +
            '</td>' +
            '<td>' +
                '<span style="color:' + (seenPct >= 80 ? 'var(--green)' : seenPct >= 50 ? 'var(--accent)' : 'var(--dispute)') + ';font-weight:600">' + seenPct + '%</span>' +
            '</td>' +
            '<td>' +
                '<span style="color:' + (dispPct > 0 ? 'var(--dispute)' : 'var(--text-muted)') + ';font-weight:600">' + dispPct + '%</span>' +
            '</td>' +
            '<td style="color:var(--text-muted)">' + data.collectors + '</td>' +
            '</tr>';
    }).join('');

    const titlesHtml = topTitles.length > 0 ? topTitles.map(([title, count], i) => 
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">' +
        '<div style="display:flex;align-items:center;gap:12px">' +
        '<span style="width:24px;height:24px;background:var(--accent-dim);color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">' + (i+1) + '</span>' +
        '<span style="font-size:13px">' + title + '</span>' +
        '</div>' +
        '<span class="tag tag-n">' + count + ' times</span>' +
        '</div>'
    ).join('') : '<div class="empty" style="padding:20px">No feedback titles yet</div>';

    const totalFb = allFbs.length;
    const totalSeen = allFbs.filter(f => f.is_seen).length;
    const totalDisputed = allFbs.filter(f => f.is_disputed).length;
    const activeTeams = teams.length;

    el('app').innerHTML = navHtml() + `
        <div class="page-wide">
            <div class="ph"><div class="pt">Analytics</div><div class="ps">Team performance overview</div></div>
            
            <div style="display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap">
                <div class="card" style="min-width:140px;text-align:center;padding:20px;margin:0;flex:1">
                    <div style="font-size:32px;font-weight:700">${totalFb}</div>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">TOTAL FEEDBACK</div>
                </div>
                <div class="card" style="min-width:140px;text-align:center;padding:20px;margin:0;flex:1">
                    <div style="font-size:32px;font-weight:700;color:var(--green)">${totalFb > 0 ? Math.round((totalSeen/totalFb)*100) : 0}%</div>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">SEEN RATE</div>
                </div>
                <div class="card" style="min-width:140px;text-align:center;padding:20px;margin:0;flex:1">
                    <div style="font-size:32px;font-weight:700;color:var(--dispute)">${totalFb > 0 ? Math.round((totalDisputed/totalFb)*100) : 0}%</div>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">DISPUTE RATE</div>
                </div>
                <div class="card" style="min-width:140px;text-align:center;padding:20px;margin:0;flex:1">
                    <div style="font-size:32px;font-weight:700;color:var(--accent)">${activeTeams}</div>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">ACTIVE TEAMS</div>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
                <div>
                    <div class="st">Team Performance</div>
                    <div class="tw">
                        <table>
                            <thead><tr>
                                <th>TEAM</th><th>FEEDBACK</th><th>SEEN</th><th>DISPUTED</th><th>COLLECTORS</th>
                            </tr></thead>
                            <tbody>${teamRows}</tbody>
                        </table>
                    </div>
                </div>
                <div>
                    <div class="st">Top Feedback Titles</div>
                    <div class="card" style="padding:0 20px">
                        ${titlesHtml}
                    </div>
                </div>
            </div>
        </div>`;
}

function showEmailBanner(mailtoLink, collectorName) {
    const existing = document.getElementById('emailBanner');
    if (existing) existing.remove();
    
    const banner = document.createElement('div');
    banner.id = 'emailBanner';
    banner.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#1A1D27;border:1px solid #4F7CFF;border-radius:12px;padding:20px;z-index:9999;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,0.5)';
    
    const title = document.createElement('div');
    title.style.cssText = 'font-size:13px;font-weight:600;color:#E8EAF0;margin-bottom:12px';
    title.textContent = '✅ Feedback sent to ' + collectorName;
    
    const emailBtn = document.createElement('a');
    emailBtn.textContent = '📧 Send Email Notification';
    emailBtn.href = mailtoLink;
    emailBtn.target = '_blank';
    emailBtn.rel = 'noopener noreferrer';
    emailBtn.style.cssText = 'display:block;width:100%;background:#4F7CFF;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;text-decoration:none;box-sizing:border-box';
    
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:11px;color:#7B8099;margin-top:8px;text-align:center';
    hint.textContent = 'Click to open email · Auto-closes in 30s';
    
    const closeBtn = document.createElement('button');
    closeBtn.innerHTML = '×';
    closeBtn.style.cssText = 'position:absolute;top:8px;right:12px;background:none;border:none;color:#7B8099;cursor:pointer;font-size:20px;line-height:1';
    closeBtn.onclick = () => banner.remove();
    
    banner.appendChild(title);
    banner.appendChild(emailBtn);
    banner.appendChild(hint);
    banner.appendChild(closeBtn);
    
    document.body.appendChild(banner);
    setTimeout(() => { if(document.getElementById('emailBanner')) banner.remove(); }, 30000);
}

// ── Init ─────────────────────────────────────────────────────────────────────
async function init() {
    await ensureTrainer();
    if (S.user) {
        if (S.user.role === 'trainer') { S.view='trainer_feedback'; loadTrainerFeedback(); }
        else { S.view='collector'; loadCollector(); }
    } else { renderLogin(); }
}

init();
</script>
